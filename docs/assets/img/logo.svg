<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Asciinema Editor — Vault-Tec Approved</title>
  <desc id="desc">Fallout-inspired vault gear logo with terminal screen</desc>
  <defs>
    <!-- subtle scanline pattern for the CRT -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#0A0A0A"/>
      <rect width="4" height="1" y="0" fill="rgba(61,214,140,0.07)"/>
      <rect width="4" height="1" y="2" fill="rgba(61,214,140,0.04)"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#FFEB8A" stop-opacity="0.95"/>
      <stop offset="38%" stop-color="#FFD23F" stop-opacity="1"/>
      <stop offset="72%" stop-color="#E8B520" stop-opacity="1"/>
      <stop offset="100%" stop-color="#B8930A" stop-opacity="1"/>
    </radialGradient>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="1"/>
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <path id="topArc" d="M 28 100 A 72 72 0 0 1 172 100"/>
    <path id="botArc" d="M 34 112 A 66 66 0 0 0 166 112"/>
  </defs>

  <!-- outer bevel / shadow -->
  <circle cx="100" cy="100" r="99" fill="#0F2335" opacity="0.95"/>
  <circle cx="100" cy="100" r="97.5" fill="none" stroke="#1A3A5A" stroke-width="1.2" opacity="0.9"/>

  <!-- vault gear -->
  <path d="M 100.00 2.00 L 122.78 15.00 L 149.00 15.13 L 162.23 37.77 L 184.87 51.00 L 185.00 77.22 L 198.00 100.00 L 185.00 122.78 L 184.87 149.00 L 162.23 162.23 L 149.00 184.87 L 122.78 185.00 L 100.00 198.00 L 77.22 185.00 L 51.00 184.87 L 37.77 162.23 L 15.13 149.00 L 15.00 122.78 L 2.00 100.00 L 15.00 77.22 L 15.13 51.00 L 37.77 37.77 L 51.00 15.13 L 77.22 15.00 Z"
        fill="url(#glow)" stroke="#0F2335" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- inner vault blue ring -->
  <circle cx="100" cy="100" r="76.5" fill="#0F2B46" stroke="#0A1E33" stroke-width="1.8"/>
  <circle cx="100" cy="100" r="73.2" fill="none" stroke="#FFD23F" stroke-width="1.1" opacity="0.95"/>
  <circle cx="100" cy="100" r="69" fill="#081A2E"/>
  <!-- subtle inner highlight -->
  <circle cx="100" cy="96" r="68.5" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- faint radiation trefoil behind terminal (very subtle) -->
  <g opacity="0.08" transform="translate(100 100)">
    <circle r="28" fill="none" stroke="#FFD23F" stroke-width="3.5"/>
    <circle r="8.5" fill="#FFD23F"/>
    <g fill="#FFD23F">
      <path d="M 0 -28 L 7 -11 L -7 -11 Z" transform="rotate(0)"/>
      <path d="M 0 -28 L 7 -11 L -7 -11 Z" transform="rotate(120)"/>
      <path d="M 0 -28 L 7 -11 L -7 -11 Z" transform="rotate(240)"/>
    </g>
  </g>

  <!-- CRT terminal plate -->
  <g filter="url(#innerShadow)">
    <rect x="56" y="62" width="88" height="70" rx="9" fill="#080B12" stroke="#1A2535" stroke-width="1.4"/>
    <!-- screen -->
    <rect x="60.5" y="67.5" width="79" height="59" rx="6" fill="url(#scan)" stroke="#172A44" stroke-width="0.9"/>
    <!-- screen inset glow -->
    <rect x="60.5" y="67.5" width="79" height="59" rx="6" fill="none" stroke="#3DD68C" stroke-opacity="0.11"/>
  </g>

  <!-- terminal content: prompt + cursor -->
  <g font-family="'Fira Code','Cascadia Code','Consolas',monospace" font-size="11.5" font-weight="700" letter-spacing="0.2">
    <text x="70" y="89" fill="#8CE8A8">bash-5.3<tspan fill="#4ADE80">$</tspan></text>
    <text x="70" y="104.5" fill="#C9D6E8" font-size="9.5" font-weight="600">▸ <tspan fill="#E8B520">pwd</tspan>  <tspan fill="#3DD68C" opacity="0.95">▶</tspan></text>
    <text x="70" y="118" fill="#7FA3C7" font-size="7.8" font-weight="500">/tmp/asciinema-demo</text>
    <!-- blinking block cursor -->
    <rect x="124.5" y="95.8" width="7.5" height="10" rx="1" fill="#FFD23F" opacity="0.95"/>
  </g>

  <!-- bottom detail: vent/speaker grille -->
  <g opacity="0.9">
    <rect x="78" y="130.5" width="44" height="3.2" rx="1.2" fill="#0E1E33" stroke="#1E3A5E" stroke-width="0.5"/>
    <g stroke="#1E3A5E" stroke-width="0.55" opacity="0.7">
      <line x1="81" y1="132.1" x2="81" y2="132.1"/><line x1="85" y1="132.1" x2="85" y2="132.1"/><line x1="89" y1="132.1" x2="89" y2="132.1"/><line x1="93" y1="132.1" x2="93" y2="132.1"/><line x1="97" y1="132.1" x2="97" y2="132.1"/><line x1="101" y1="132.1" x2="101" y2="132.1"/><line x1="105" y1="132.1" x2="105" y2="132.1"/><line x1="109" y1="132.1" x2="109" y2="132.1"/><line x1="113" y1="132.1" x2="113" y2="132.1"/><line x1="117" y1="132.1" x2="117" y2="132.1"/>
    </g>
    <circle cx="83.5" cy="132.1" r="1.0" fill="#2A4A6B"/><circle cx="89" cy="132.1" r="1.0" fill="#2A4A6B"/><circle cx="94.5" cy="132.1" r="1.0" fill="#2A4A6B"/><circle cx="100" cy="132.1" r="1.0" fill="#2A4A6B"/><circle cx="105.5" cy="132.1" r="1.0" fill="#2A4A6B"/><circle cx="111" cy="132.1" r="1.0" fill="#2A4A6B"/><circle cx="116.5" cy="132.1" r="1.0" fill="#2A4A6B"/>
  </g>

  <!-- vault bolts (8 around the inner ring) -->
  <g fill="#C9B16A" stroke="#0F2335" stroke-width="0.9">
    <circle cx="177.6" cy="67.9" r="3.2"/><circle cx="182.0" cy="72.2" r="1.0" fill="#F5E6C8" opacity="0.9"/>
    <circle cx="177.6" cy="132.1" r="3.2"/><circle cx="182.0" cy="127.8" r="1.0" fill="#F5E6C8" opacity="0.9"/>
    <circle cx="132.1" cy="177.6" r="3.2"/><circle cx="127.8" cy="182.0" r="1.0" fill="#F5E6C8" opacity="0.9"/>
    <circle cx="67.9" cy="177.6" r="3.2"/><circle cx="72.2" cy="182.0" r="1.0" fill="#F5E6C8" opacity="0.9"/>
    <circle cx="22.4" cy="132.1" r="3.2"/><circle cx="18.0" cy="127.8" r="1.0" fill="#F5E6C8" opacity="0.9"/>
    <circle cx="22.4" cy="67.9" r="3.2"/><circle cx="18.0" cy="72.2" r="1.0" fill="#F5E6C8" opacity="0.9"/>
    <circle cx="67.9" cy="22.4" r="3.2"/><circle cx="72.2" cy="18.0" r="1.0" fill="#F5E6C8" opacity="0.9"/>
    <circle cx="132.1" cy="22.4" r="3.2"/><circle cx="127.8" cy="18.0" r="1.0" fill="#F5E6C8" opacity="0.9"/>
  </g>

  <!-- curved text -->
  <g font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="800" letter-spacing="0.11em" text-transform="uppercase">
    <text font-size="13.5" fill="#0F2335" stroke="#FFD23F" stroke-width="0.45" paint-order="stroke" stroke-linejoin="round">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle" dominant-baseline="middle">ASCINEMA</textPath>
    </text>
    <text font-size="11.2" fill="#FFD23F" stroke="#0F2335" stroke-width="0.55" paint-order="stroke">
      <textPath href="#botArc" startOffset="50%" text-anchor="middle">EDITOR • VAULT 3</textPath>
    </text>
  </g>

  <!-- bottom ribbon -->
  <g>
    <path d="M 58 154.5 L 142 154.5 L 136.5 163.5 L 63.5 163.5 Z" fill="#0F2335" stroke="#FFD23F" stroke-width="0.9"/>
    <text x="100" y="160.2" text-anchor="middle" font-family="'Inter',sans-serif" font-size="5.8" font-weight="800" letter-spacing="0.14em" fill="#FFD23F">VAULT-TEC APPROVED</text>
  </g>

  <!-- tiny establishment mark -->
  <text x="100" y="172.2" text-anchor="middle" font-family="'Inter',sans-serif" font-size="4.2" font-weight="700" letter-spacing="0.18em" fill="#1A3A5A" opacity="0.9">EST. 2077 • v3 • GHOSTTY-WEB</text>
</svg>
