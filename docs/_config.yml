remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme

title: Asciinema Editor
description: "Vault-Tec approved editor for asciinema .cast files — desktop + browser."
url: "https://cldmnky.github.io"
baseurl: "/ascinemaeditor"

logo: assets/img/logo.svg

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

show_downloads: false
google_analytics:

exclude:
  - screenshots/raw
  - "*.gemspec"
  - Gemfile
  - Gemfile.lock
