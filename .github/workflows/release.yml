name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Server/browser-mode binaries: static, no CGO, built on Linux.
  build:
    name: Server ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/ascinemaeditor-server-${GOOS}-${GOARCH}" .

      - uses: actions/upload-artifact@v4
        with:
          name: ascinemaeditor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # Wails desktop app for macOS. Needs a real macOS runner: the Cocoa/WebKit
  # backend is compiled via CGO against Apple frameworks. A universal build
  # covers both Intel and Apple Silicon in one bundle.
  desktop-darwin:
    name: Desktop darwin (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Sync embedded frontend
        run: |
          mkdir -p frontend/dist
          cp index.html frontend/dist/index.html

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build desktop app (darwin/universal)
        run: "$(go env GOPATH)/bin/wails build -platform darwin/universal -ldflags '-w -s'"

      - name: Zip app bundle
        run: |
          mkdir -p dist
          cd build/bin
          zip -r -y --quiet "../../dist/ascinemaeditor-desktop-macos-universal.zip" ascinemaeditor.app
          cd ../..
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ascinemaeditor-desktop-macos-universal
          path: dist/*
          if-no-files-found: error

  # Wails desktop app for Windows. Built on a Windows runner: the WebView2
  # backend needs no CGO, but cross-compiling Wails -> Windows from Linux is
  # not supported by the CLI. windowsgui subsystem hides the console window.
  desktop-windows:
    name: Desktop windows (amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Sync embedded frontend
        shell: bash
        run: |
          mkdir -p frontend/dist
          cp index.html frontend/dist/index.html

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build desktop app (windows/amd64)
        shell: bash
        run: "$(go env GOPATH)/bin/wails.exe build -platform windows/amd64 -ldflags '-w -s -H windowsgui'"

      - name: Zip executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/bin/ascinemaeditor.exe -DestinationPath dist/ascinemaeditor-desktop-windows-amd64.zip
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: ascinemaeditor-desktop-windows-amd64
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build, desktop-darwin, desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums-sha256.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## Which download do I want?

            **Desktop apps (Wails)** — open a native window, no browser needed, native Open/Save dialogs:

            | File | Platform | Notes |
            |---|---|---|
            | `ascinemaeditor-desktop-macos-universal.zip` | macOS 11+ (Intel & Apple Silicon) | Unzip and run `Asciinema Editor.app`. Ad-hoc signed; right-click → Open on first launch if Gatekeeper complains. |
            | `ascinemaeditor-desktop-windows-amd64.zip` | Windows 10/11 64-bit | Unzip and run `ascinemaeditor.exe`. Uses the system WebView2 runtime. |

            **Server binaries (browser mode)** — serve the editor on http://localhost:8080 and connect with any browser. Fully static, no dependencies:

            | File | Platform |
            |---|---|
            | `ascinemaeditor-server-linux-amd64` / `-arm64` | Linux 64-bit / ARM64 |
            | `ascinemaeditor-server-darwin-amd64` / `-arm64` | macOS 64-bit Intel / ARM64 (run with the `serve` argument) |

            All assets are covered by `checksums-sha256.txt`. Both build types embed the full UI; see the README for usage details.
