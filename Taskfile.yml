version: '3'

vars:
  PORT: '8080'
  BINARY_NAME: 'ascinemaeditor'
  BIN_DIR: './bin'

tasks:
  build:
    desc: Build the Go web server
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/{{.BINARY_NAME}} main.go
    sources:
      - main.go
      - go.mod
    generates:
      - '{{.BIN_DIR}}/{{.BINARY_NAME}}'

  run:
    desc: Run the web server
    deps: [build]
    cmds:
      - '{{.BIN_DIR}}/{{.BINARY_NAME}}'
    env:
      PORT: '{{.PORT}}'

  dev:
    desc: Run the server in development mode with live reload
    cmds:
      - task: build
      - task: dev:watch
    
  dev:watch:
    desc: Watch for changes and restart server
    deps: [build]
    cmds:
      - '{{.BIN_DIR}}/{{.BINARY_NAME}}'
    env:
      PORT: '{{.PORT}}'
    watch: true
    sources:
      - main.go
      - index.html
      - test-data/**/*

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}

  serve:
    desc: Build and serve the application
    deps: [build]
    cmds:
      - echo "Starting Asciinema Web Editor on http://localhost:{{.PORT}}"
      - '{{.BIN_DIR}}/{{.BINARY_NAME}}'
    env:
      PORT: '{{.PORT}}'

  default:
    desc: Default task - build and serve
    deps: [serve]